name: Deploy Java Notes to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # This is the key part: it publishes the contents of notes/
      # as the site root, so notes/index.html becomes the deployed index.html.
      - name: Upload notes/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./notes"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
